<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Admin — E-Election OSIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(99,102,241,.08) 0, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(56,189,248,.06) 0, transparent 50%),
        radial-gradient(circle at 60% 80%, rgba(168,85,247,.05) 0, transparent 50%);
      pointer-events: none;
    }

    .login-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px; padding: 20px;
    }

    .login-card {
      background: rgba(30,41,59,.7);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(51,65,85,.6);
      border-radius: 16px;
      padding: 44px 36px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,.5);
    }

    .login-header { text-align: center; margin-bottom: 32px; }

    .login-header .tag {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: #818cf8; margin-bottom: 16px;
      background: rgba(99,102,241,.12);
      padding: 6px 14px; border-radius: 20px;
    }
    .login-header .tag::before {
      content: ''; width: 6px; height: 6px;
      background: #818cf8; border-radius: 50%;
    }

    .login-header h1 {
      font-size: 22px; font-weight: 700; letter-spacing: -0.3px;
      background: linear-gradient(135deg, #e2e8f0, #94a3b8);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .login-header p { font-size: 13px; color: #64748b; }

    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 0.8px; text-transform: uppercase;
      color: #94a3b8; margin-bottom: 8px;
    }
    .field input {
      width: 100%; padding: 12px 16px; font-size: 14px; font-family: inherit;
      background: rgba(15,23,42,.6); color: #e2e8f0;
      border: 1px solid #334155; border-radius: 10px;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .field input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    }
    .field input::placeholder { color: #475569; }

    .btn-submit {
      width: 100%; padding: 13px; font-size: 13px; font-weight: 600; font-family: inherit;
      letter-spacing: 0.5px; border: none; border-radius: 10px; cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; transition: opacity .2s, transform .1s;
    }
    .btn-submit:hover { opacity: .9; }
    .btn-submit:active { transform: scale(.98); }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }

    .error-msg {
      display: none; margin-top: 14px; padding: 11px 14px;
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25);
      color: #fca5a5; font-size: 13px; text-align: center; border-radius: 10px;
    }

    .success-msg {
      display: none; margin-top: 14px; padding: 11px 14px;
      background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.25);
      color: #86efac; font-size: 13px; text-align: center; border-radius: 10px;
    }

    .register-footer {
      text-align: center; margin-top: 24px;
      font-size: 13px; color: #64748b;
    }
    .register-footer a {
      color: #818cf8; text-decoration: none; font-weight: 600;
    }
    .register-footer a:hover { text-decoration: underline; }

    .footer {
      text-align: center; margin-top: 24px;
      font-size: 11px; color: #475569;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-header">
        <div class="tag">Admin Panel</div>
        <h1>E-Election OSIS</h1>
        <p>Buat akun admin baru untuk mengakses dashboard.</p>
      </div>
      <form id="registerForm" autocomplete="on">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukkan password (min. 6 karakter)" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn-submit" id="btnRegister">Daftar</button>
        <div class="error-msg" id="errorBox"></div>
        <div class="success-msg" id="successBox"></div>
      </form>

      <div class="register-footer">
        Sudah punya akun? <a href="/admin/login.html">Masuk</a>
      </div>
    </div>
    <div class="footer">E-Election OSIS &copy; 2026 &mdash; Sistem Pemilihan Digital</div>
  </div>

  <script src="admin.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const btn = document.getElementById('btnRegister');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!username || !password) { showError('Username dan password harus diisi'); return; }

      btn.disabled = true; btn.textContent = 'Memproses...';
      errorBox.style.display = 'none'; successBox.style.display = 'none';

      try {
        await AdminAPI.register(username, password);
        successBox.textContent = 'Registrasi berhasil! Mengalihkan ke halaman login...';
        successBox.style.display = 'block';
        setTimeout(() => { location.href = '/admin/login.html'; }, 1500);
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false; btn.textContent = 'Daftar';
      }
    });

    function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }
  </script>
</body>
</html>

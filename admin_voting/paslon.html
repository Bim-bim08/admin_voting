<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Paslon — E-Election OSIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg:#0f172a; --sidebar:#1e293b; --card:#1e293b; --border:#334155;
      --text:#e2e8f0; --text-dim:#94a3b8; --text-mute:#64748b;
      --accent:#818cf8; --accent2:#6366f1; --green:#34d399; --green-bg:rgba(52,211,153,.12);
      --orange:#fb923c; --orange-bg:rgba(251,146,60,.12); --red:#f87171; --red-bg:rgba(248,113,113,.12);
      --glass:rgba(30,41,59,.75); --glass-border:rgba(51,65,85,.6);
    }
    html{font-size:14px} body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;overflow-x:hidden}

    .sidebar{position:fixed;top:0;left:0;width:260px;height:100vh;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:50;transition:transform .3s}
    .sb-head{padding:24px 22px 20px;border-bottom:1px solid var(--border)}
    .sb-logo{font-size:16px;font-weight:700;letter-spacing:-.3px;background:linear-gradient(135deg,var(--accent),#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
    .sb-sub{font-size:11px;color:var(--text-mute);letter-spacing:.5px}
    .sb-status{display:flex;align-items:center;gap:8px;padding:14px 22px;border-bottom:1px solid var(--border)}
    .sb-status .dot{width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 8px rgba(52,211,153,.5)}
    .sb-status span{font-size:12px;color:var(--text-dim)}
    .sb-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
    .sb-nav a{display:flex;align-items:center;gap:12px;padding:11px 16px;font-size:13px;font-weight:500;font-family:inherit;color:var(--text-dim);background:transparent;border:none;border-radius:10px;cursor:pointer;transition:all .15s;text-decoration:none;width:100%}
    .sb-nav a:hover{background:rgba(99,102,241,.08);color:var(--text)}
    .sb-nav a.active{background:rgba(99,102,241,.12);color:var(--accent)}
    .sb-nav a .icon{font-size:18px;width:22px;text-align:center}
    .sb-foot{padding:16px 22px;border-top:1px solid var(--border)}
    .btn-logout{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;font-size:12px;font-weight:600;font-family:inherit;letter-spacing:.5px;text-transform:uppercase;color:var(--red);background:var(--red-bg);border:1px solid rgba(248,113,113,.2);border-radius:10px;cursor:pointer;transition:all .15s}
    .btn-logout:hover{background:rgba(248,113,113,.2)}

    .main{margin-left:260px;flex:1;min-height:100vh}
    .top-bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:rgba(15,23,42,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .top-bar h2{font-size:17px;font-weight:700;letter-spacing:-.2px}
    .clock{font-size:12px;color:var(--text-mute);font-variant-numeric:tabular-nums}
    .content{padding:24px 28px 40px}

    .sec-title{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-mute);margin-bottom:14px}

    .paslon-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .paslon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
    .paslon-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .2s}
    .paslon-card:hover{border-color:#475569}
    .paslon-photo{width:100%;height:200px;object-fit:cover;background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(168,85,247,.1));display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--text-mute)}
    .paslon-photo img{width:100%;height:100%;object-fit:cover}
    .paslon-body{padding:18px 20px}
    .paslon-num{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;font-size:14px;font-weight:700;background:rgba(99,102,241,.15);color:var(--accent);border-radius:8px;margin-bottom:10px}
    .paslon-name{font-size:16px;font-weight:700;margin-bottom:10px}
    .paslon-visi,.paslon-misi{font-size:12px;color:var(--text-dim);line-height:1.6;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .paslon-visi strong,.paslon-misi strong{color:var(--text-mute);font-weight:600}
    .paslon-votes{font-size:12px;color:var(--accent);font-weight:600;margin-top:4px}
    .paslon-actions{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border)}
    .paslon-actions button{flex:1;padding:8px;font-size:11px;font-weight:600;font-family:inherit;letter-spacing:.5px;text-transform:uppercase;border-radius:8px;cursor:pointer;transition:all .15s}
    .btn-edit{background:rgba(99,102,241,.1);color:var(--accent);border:1px solid rgba(99,102,241,.25)}
    .btn-edit:hover{background:rgba(99,102,241,.2)}
    .btn-del{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,.2)}
    .btn-del:hover{background:rgba(248,113,113,.2)}
    .paslon-empty{grid-column:1/-1;text-align:center;padding:48px;color:var(--text-mute);font-size:13px}

    .btn-add{padding:10px 18px;font-size:11px;font-weight:600;font-family:inherit;letter-spacing:.5px;text-transform:uppercase;border-radius:10px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:none;cursor:pointer;transition:opacity .2s}
    .btn-add:hover{opacity:.85}

    .modal-bg{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);align-items:center;justify-content:center}
    .modal-bg.show{display:flex}
    .modal{background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:18px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,.5);animation:modalIn .25s ease}
    @keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
    .modal-head h2{font-size:16px;font-weight:700}
    .btn-x{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-mute);background:rgba(51,65,85,.3);border:none;border-radius:8px;cursor:pointer;transition:all .15s}
    .btn-x:hover{background:rgba(51,65,85,.5);color:var(--text)}
    .modal-body{padding:24px}
    .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border)}
    .fg{margin-bottom:16px}
    .fg label{display:block;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-mute);margin-bottom:6px}
    .fg input,.fg textarea{width:100%;padding:11px 14px;font-size:13px;font-family:inherit;background:rgba(15,23,42,.5);color:var(--text);border:1px solid var(--border);border-radius:10px;outline:none;transition:border-color .2s}
    .fg input:focus,.fg textarea:focus{border-color:var(--accent)}
    .fg textarea{min-height:72px;resize:vertical}
    .fg input::placeholder,.fg textarea::placeholder{color:#475569}
    .btn-cancel{padding:10px 18px;font-size:11px;font-weight:600;font-family:inherit;letter-spacing:.5px;text-transform:uppercase;border-radius:10px;background:transparent;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;transition:all .15s}
    .btn-cancel:hover{border-color:#475569;color:var(--text)}
    .btn-save{padding:10px 24px;font-size:11px;font-weight:600;font-family:inherit;letter-spacing:.5px;text-transform:uppercase;border-radius:10px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:none;cursor:pointer;transition:opacity .2s}
    .btn-save:hover{opacity:.85}

    .toast{position:fixed;bottom:24px;right:24px;z-index:300;padding:12px 22px;font-size:13px;font-weight:500;color:#fff;border-radius:10px;transform:translateY(100px);opacity:0;transition:all .3s}
    .toast.show{transform:translateY(0);opacity:1}
    .toast.ok{background:rgba(52,211,153,.85)}
    .toast.err{background:rgba(248,113,113,.85)}

    .skeleton{background:linear-gradient(90deg,var(--border) 25%,rgba(51,65,85,.6) 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .skeleton-photo{height:200px;border-radius:14px 14px 0 0}
    .skeleton-line{height:14px;margin-bottom:8px}
    .skeleton-line-short{width:60%}
    .skeleton-block{height:80px;border-radius:10px}

    .error-box{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px;color:var(--text-mute);font-size:13px}
    .error-box .err-icon{font-size:32px;opacity:.6}
    .error-box .err-msg{color:var(--red);font-weight:500}
    .error-box button{margin-top:6px;padding:8px 16px;font-size:11px;font-weight:600;font-family:inherit;letter-spacing:.5px;text-transform:uppercase;border-radius:8px;background:rgba(99,102,241,.1);color:var(--accent);border:1px solid rgba(99,102,241,.25);cursor:pointer}
    .error-box button:hover{background:rgba(99,102,241,.2)}

    .confirm-bg{display:none;position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);align-items:center;justify-content:center}
    .confirm-bg.show{display:flex}
    .confirm-box{background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:18px;width:100%;max-width:400px;padding:28px;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,.5);animation:modalIn .25s ease}
    .confirm-box .c-icon{font-size:36px;margin-bottom:12px}
    .confirm-box .c-msg{font-size:14px;color:var(--text);margin-bottom:20px;line-height:1.5}
    .confirm-box .c-actions{display:flex;gap:10px;justify-content:center}
    .confirm-box .c-actions button{padding:10px 24px;font-size:11px;font-weight:600;font-family:inherit;letter-spacing:.5px;text-transform:uppercase;border-radius:10px;cursor:pointer;transition:all .15s}
    .c-btn-cancel{background:transparent;border:1px solid var(--border);color:var(--text-dim)}
    .c-btn-cancel:hover{border-color:#475569;color:var(--text)}
    .c-btn-danger{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.3);color:var(--red)}
    .c-btn-danger:hover{background:rgba(248,113,113,.25)}
    .c-btn-primary{background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;color:#fff}
    .c-btn-primary:hover{opacity:.85}

    .btn-loading{position:relative;pointer-events:none;opacity:.7}
    .btn-loading::after{content:'';position:absolute;width:14px;height:14px;top:50%;left:50%;margin:-7px 0 0 -7px;border:2px solid transparent;border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.paslon-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sb-head"><div class="sb-logo">E-Election OSIS</div><div class="sb-sub">Admin Dashboard</div></div>
  <div class="sb-status"><div class="dot"></div><span>Admin Active</span></div>
  <nav class="sb-nav">
    <a href="/admin/dashboard.html"><span class="icon">📊</span> Dashboard</a>
    <a href="/admin/dashboard.html#quickcount"><span class="icon">🗳️</span> Quick Count</a>
    <a class="active" href="/admin/paslon.html"><span class="icon">👤</span> Data Paslon</a>
    <a href="/admin/dpt.html"><span class="icon">📋</span> Data DPT</a>
  </nav>
  <div class="sb-foot"><button class="btn-logout" onclick="AdminAPI.logout()"><span>🚪</span> Keluar</button></div>
</aside>

<div class="main">
  <div class="top-bar">
    <h2>Data Paslon</h2>
    <div class="clock" id="clock"></div>
  </div>
  <div class="content">
    <div class="paslon-toolbar">
      <span class="sec-title">Manajemen Pasangan Calon</span>
      <button class="btn-add" onclick="CandUI.open()">+ Tambah Paslon</button>
    </div>
    <div class="paslon-grid" id="paslonGrid"><div class="paslon-empty">Memuat data&hellip;</div></div>
  </div>
</div>

<div class="modal-bg" id="candModal">
  <div class="modal">
    <div class="modal-head"><h2 id="candModalTitle">Tambah Paslon</h2><button class="btn-x" onclick="CandUI.close()">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="candId">
      <div class="fg"><label>Nomor Urut</label><input type="number" id="candNumber" min="1" placeholder="Contoh: 1"></div>
      <div class="fg"><label>Nama Ketua</label><input type="text" id="candChairman" placeholder="Nama ketua kandidat"></div>
      <div class="fg"><label>Nama Wakil Ketua</label><input type="text" id="candVice" placeholder="Nama wakil ketua kandidat"></div>
      <div class="fg"><label>Visi</label><textarea id="candVision" placeholder="Tuliskan visi kandidat"></textarea></div>
      <div class="fg"><label>Misi</label><textarea id="candMission" placeholder="Tuliskan misi kandidat"></textarea></div>
      <div class="fg"><label>Photo URL <span style="color:#475569">(opsional)</span></label><input type="text" id="candPhoto" placeholder="https://..."></div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="CandUI.close()">Batal</button>
      <button class="btn-save" onclick="CandUI.save()">Simpan</button>
    </div>
  </div>
</div>

<div class="confirm-bg" id="confirmModal">
  <div class="confirm-box">
    <div class="c-icon" id="confirmIcon"></div>
    <div class="c-msg" id="confirmMsg"></div>
    <div class="c-actions">
      <button class="c-btn-cancel" onclick="closeConfirm(false)">Batal</button>
      <button id="confirmBtn" onclick="closeConfirm(true)">Ya, Lanjutkan</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="admin.js"></script>
<script>
  var admin = JSON.parse(localStorage.getItem('admin') || 'null');
  if (!admin) location.href = '/admin/login.html';

  function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML}
  function toast(msg,type){type=type||'ok';var t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(function(){t.className='toast'},3000)}

  // Silence semua unhandled rejections — jangan tampilkan error notification
  // yang tidak ter-handle (termasuk background request seperti auth/status check)
  window.addEventListener('unhandledrejection',function(e){e.preventDefault();console.warn('Unhandled rejection silenced:',e.reason)})

  var _confirmResolve=null;
  function showConfirm(msg,icon,danger){
    return new Promise(function(resolve){
      _confirmResolve=resolve;
      document.getElementById('confirmIcon').textContent=icon||'❓';
      document.getElementById('confirmMsg').textContent=msg;
      var btn=document.getElementById('confirmBtn');
      btn.className=danger?'c-btn-danger':'c-btn-primary';
      btn.textContent=danger?'Ya, Hapus':'Ya, Lanjutkan';
      document.getElementById('confirmModal').classList.add('show');
    });
  }
  function closeConfirm(val){document.getElementById('confirmModal').classList.remove('show');if(_confirmResolve){_confirmResolve(val);_confirmResolve=null}}
  function updateClock(){var now=new Date();document.getElementById('clock').textContent=now.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})+' \u2022 '+now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
  updateClock();setInterval(updateClock,1000);

  // ============================================
  // Candidate state & config
  // ============================================
  var candList=[];
  var LOGO_FALLBACK='/logo-osis.png';

  // ============================================
  // Load Candidates via AdminAPI (GET /api/candidates)
  // ============================================
  async function loadCandidates(){
    var grid=document.getElementById('paslonGrid');
    grid.innerHTML='<div class="paslon-empty"><div class="skeleton skeleton-photo"></div></div><div class="paslon-empty"><div class="skeleton skeleton-photo"></div></div>';
    try{
      var res=await AdminAPI.paslon.list();
      // Handle dual format: array directly OR wrapped in {data:[...]}
      candList=Array.isArray(res)?res:(res.data||[]);
      // SUKSES — data dimuat, tampilkan di UI
      if(!candList.length){grid.innerHTML='<div class="paslon-empty">Belum ada kandidat terdaftar</div>';return}
      grid.innerHTML=candList.map(function(c){
      var photoUrl=c.photo||c.photo_url||'';
      var photo=photoUrl
        ?'<img src="'+esc(photoUrl)+'" alt="'+esc(c.chairman_name)+'" onerror="this.onerror=null;this.src=\''+LOGO_FALLBACK+'\'">'
        :'<img src="'+LOGO_FALLBACK+'" alt="'+esc(c.chairman_name)+'">';
      return '<div class="paslon-card">'+
        '<div class="paslon-photo">'+photo+'</div>'+
        '<div class="paslon-body">'+
          '<div class="paslon-num">'+(c.candidate_number||c.id)+'</div>'+
          '<div class="paslon-name">'+esc(c.chairman_name)+' & '+esc(c.vice_chairman_name)+'</div>'+
          '<div class="paslon-visi"><strong>Visi: </strong>'+esc(c.vision)+'</div>'+
          '<div class="paslon-misi"><strong>Misi: </strong>'+esc(c.mission)+'</div>'+
          '<div class="paslon-votes">'+(c.votes||0)+' suara</div>'+
        '</div>'+
        '<div class="paslon-actions">'+
          '<button class="btn-edit" onclick="CandUI.edit('+c.id+')">Edit</button>'+
          '<button class="btn-del" onclick="CandUI.del('+c.id+',\''+esc(c.chairman_name).replace(/'/g,"\\'")+'\')">Hapus</button>'+
        '</div>'+
      '</div>';
    }).join('');
      return; // STOP — tidak lanjut ke blok error
    }catch(e){
      candList=[];
      // Hanya tampilkan toast untuk error jaringan/ server (bukan 404)
      if(e instanceof TypeError || (e.status && e.status >= 500)){
        console.error('loadCandidates network/server error:',e);
        toast(e.message || 'Terjadi kesalahan jaringan','err');
      }else{
        // Non-critical (404, endpoint opsional) → senyap, tidak ganggu user
        console.info('loadCandidates non-critical:',e.message||e);
      }
      grid.innerHTML='<div class="paslon-empty">Gagal memuat data kandidat</div>';
    }
  }

  // ============================================
  // Candidate UI (Modal + CRUD actions)
  // ============================================
  var CandUI={
    open:function(d){
      document.getElementById('candModal').classList.add('show');
      document.getElementById('candModalTitle').textContent=d?'Edit Paslon':'Tambah Paslon';
      document.getElementById('candId').value=d?d.id:'';
      document.getElementById('candNumber').value=d?d.candidate_number:'';
      document.getElementById('candChairman').value=d?d.chairman_name:'';
      document.getElementById('candVice').value=d?d.vice_chairman_name:'';
      document.getElementById('candVision').value=d?d.vision:'';
      document.getElementById('candMission').value=d?d.mission:'';
      document.getElementById('candPhoto').value=d&&d.photo?d.photo:'';
    },
    close:function(){document.getElementById('candModal').classList.remove('show')},
    edit:function(id){for(var i=0;i<candList.length;i++){if(candList[i].id===id){this.open(candList[i]);return}}},

    // DELETE: AdminAPI.paslon.del(id) → DELETE /api/candidates?id=${id}
    del:async function(id,name){
      var ok=await showConfirm('⚠️ Hapus kandidat ini?','⚠️',true);
      if(!ok)return;
      try{
        await AdminAPI.paslon.del(id);
        // SUKSES — tampilkan toast, tutup modal, reload, STOP
        toast('Kandidat berhasil dihapus');
        CandUI.close();
        loadCandidates();
        return; // Early return — tidak lanjut ke catch
      }catch(e){
        // GAGAL — hanya tampilkan pesan dinamis
        toast(e.message||'Terjadi kesalahan jaringan','err');
      }
    },

    // POST/PUT via direct fetch to API_URL
    save:async function(){
      var id=document.getElementById('candId').value;
      var num=document.getElementById('candNumber').value;
      var namaKetua=document.getElementById('candChairman').value.trim();
      var namaWakil=document.getElementById('candVice').value.trim();
      var visi=document.getElementById('candVision').value.trim();
      var misi=document.getElementById('candMission').value.trim();
      var foto=document.getElementById('candPhoto').value.trim()||null;
      if(!num||!namaKetua){toast('Nomor urut dan Nama Ketua wajib diisi','err');return}
      var API_URL='https://web-voting-phi.vercel.app/api/candidates';
      var method=id?'PUT':'POST';
      var payload={
        id:id?parseInt(id):null,
        candidate_number:parseInt(num),
        chairman_name:namaKetua,
        vice_chairman_name:namaWakil||null,
        vision:visi||null,
        mission:misi||null,
        photo:foto
      };
      var saveBtn=document.querySelector('.modal-foot .btn-save');
      saveBtn.classList.add('btn-loading');saveBtn.disabled=true;
      try{
        var res=await fetch(API_URL,{
          method:method,
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(payload)
        });
        var data;
        try{data=await res.json()}catch(_){data={}}
        if(!res.ok){
          // Hanya blok ini yang menangani error HTTP
          throw new Error(data.message||data.error||'Terjadi kesalahan jaringan');
        }
        // SUKSES (res.ok) — tampilkan toast, tutup modal, reload, STOP
        this.close();
        toast(id?'Paslon berhasil diperbarui':'Paslon berhasil ditambahkan');
        loadCandidates();
        return; // Early return — tidak lanjut ke catch
      }catch(e){
        // GAGAL — hanya tampilkan pesan dinamis, tidak ada fallback hardcoded
        toast(e.message||'Terjadi kesalahan jaringan','err');
      }finally{saveBtn.classList.remove('btn-loading');saveBtn.disabled=false}
    }
  };

  document.querySelectorAll('.modal-bg').forEach(function(el){el.addEventListener('click',function(e){if(e.target===el)el.classList.remove('show')})});
  loadCandidates();
</script>
</body>
</html>

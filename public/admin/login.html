<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — E-Election OSIS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid #e0e0d8;
      padding: 48px 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-header .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 16px;
    }

    .login-header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 13px;
      color: #777;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid #e0e0d8;
      background: #fafaf7;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #1a1a1a;
    }

    .form-group input::placeholder {
      color: #bbb;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: #1a1a1a;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background: #333;
    }

    .btn-login:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .error-message {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      font-size: 13px;
      text-align: center;
    }

    .footer-note {
      text-align: center;
      margin-top: 32px;
      font-size: 11px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="badge">Admin Panel</div>
        <h1>E-Election OSIS</h1>
        <p>Masukkan kredensial admin untuk mengakses dashboard.</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login" id="btnLogin">Masuk</button>
        <div class="error-message" id="errorMsg"></div>
      </form>
    </div>
    <div class="footer-note">
      E-Election OSIS &copy; 2026 — Sistem Pemilihan Digital
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const btnLogin = document.getElementById('btnLogin');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        showError('Username dan password harus diisi');
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Memproses...';
      errorMsg.style.display = 'none';

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'Login gagal');
          return;
        }

        // Store admin info
        localStorage.setItem('admin', JSON.stringify(data.admin));

        // Redirect to dashboard
        window.location.href = '/admin/dashboard';
      } catch (err) {
        showError('Terjadi kesalahan. Silakan coba lagi.');
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = 'Masuk';
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    // Check if already logged in
    if (localStorage.getItem('admin')) {
      window.location.href = '/admin/dashboard';
    }
  </script>
</body>
</html>
